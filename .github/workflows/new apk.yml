name: APK derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Depo kökündeki zip'i bulup açar (telefonda klasör yüklemek gerekmesin diye)
      - name: Projeyi hazırla
        run: |
          ZIP=$(ls ./*.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            echo "Zip bulundu: $ZIP"
            mkdir -p proje
            unzip -q -o "$ZIP" -d proje
            DIR=$(dirname "$(find proje -name settings.gradle.kts | head -1)")
          else
            echo "Zip yok, depo kökü kullanılıyor"
            DIR=.
          fi
          echo "Proje klasörü: $DIR"
          ls -la "$DIR"
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - name: APK derle
        run: |
          set -o pipefail
          gradle -p "$DIR" assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Hata özeti (başarısız olursa)
        if: failure()
        run: |
          {
            echo '## Derleme hataları'
            echo '```'
            grep -nE "^e: |error:|What went wrong|Could not resolve|Execution failed|Unresolved|Where:" -A3 build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK'yı yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VideoIndirici-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
