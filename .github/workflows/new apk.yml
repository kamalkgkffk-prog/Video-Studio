name: APK derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK derle
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Hata özeti (başarısız olursa)
        if: failure()
        run: |
          {
            echo '## Derleme hataları'
            echo '```'
            grep -nE "^e: |error:|What went wrong|Could not resolve|Execution failed|Unresolved" -A3 build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK'yı yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VideoIndirici-apk
          path: app/build/outputs/apk/debug/app-debug.apk
